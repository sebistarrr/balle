name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/deploy-files-hb5sjk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Prérequis, une seule fois : Settings > Pages > Source = GitHub Actions.
      # `enablement: true` ne suffit pas ici — créer le site demande un droit
      # admin que le GITHUB_TOKEN du workflow n'a pas.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
