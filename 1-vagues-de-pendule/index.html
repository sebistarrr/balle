<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vague de pendules — rendu</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #000; color: #7f8a8a;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; padding: 1rem;
    font: 400 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  canvas { display: block; height: min(78dvh, 90vw * 16 / 9); aspect-ratio: 9/16; }
  .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
         justify-content: center; }
  button, a.btn {
    background: #101414; color: #9aa5a5; border: 1px solid #232b2b;
    border-radius: 7px; padding: .4rem .8rem; font: inherit;
    cursor: pointer; text-decoration: none;
  }
  button[aria-pressed="true"] { color: #49c4b9; border-color: #2c4a49; }
  p { margin: 0; max-width: 46ch; text-align: center; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="bar">
  <a class="btn" href="../">← animations</a>
  <button id="play" aria-pressed="true">❚❚ pause</button>
  <button id="snd" aria-pressed="false">♪ son</button>
  <!-- adapte le lien si tu déplaces le script -->
  <a class="btn" href="pendulum_wave.py">code Manim</a>
  <a class="btn" href="shorts.mp4" download>↓ mp4 1080×1920</a>
</div>

<p>16 pendules&nbsp;; le <em>k</em><sup>e</sup> effectue <em>30&nbsp;−&nbsp;k</em>
   oscillations par cycle de 96&nbsp;s. Boucle exacte.</p>

<script>
// ---------------------------------------------------------------------------
//  Mêmes constantes que pendulum_wave.py, dans le repère pixel d'origine.
//  Ce fichier n'est qu'un aperçu : la référence reste le script Manim.
// ---------------------------------------------------------------------------
const N = 16, CYCLE = 96, OSC_MAX = 30;
const AMP = 25 * Math.PI / 180, GUIDE = 26.5 * Math.PI / 180;
const W = 1080, H = 1920, PX = 540, PY = 400;
const L_MIN = 627.4, L_MAX = 1049.2, R = 33.5;
const STOPS = ['#F56E51', '#F9B060', '#49C4B9', '#1F99D0'];

const periode  = k => CYCLE / (OSC_MAX - k);
const longueur = k => L_MIN + (L_MAX - L_MIN) * k / (N - 1);

// dégradé : interpolation linéaire entre les 4 couleurs de référence
const COL = Array.from({ length: N }, (_, i) => {
  const u = i / (N - 1) * (STOPS.length - 1);
  const j = Math.min(Math.floor(u), STOPS.length - 2), f = u - j;
  const hex = s => [1, 3, 5].map(p => parseInt(s.slice(p, p + 2), 16));
  const a = hex(STOPS[j]), b = hex(STOPS[j + 1]);
  return a.map((v, n) => Math.round(v + (b[n] - v) * f));
});
const rgba = (c, o = 1) => `rgba(${c[0]},${c[1]},${c[2]},${o})`;

// onde triangulaire : vitesse angulaire constante, demi-tour instantané
function angle(k, t) {
  const ph = (t / periode(k)) % 1;
  return AMP * (ph < 0.5 ? 4 * ph - 1 : 3 - 4 * ph);
}

// couleur du dernier pendule ayant touché ce côté (0 = gauche, 1 = droite)
// extrêmes à t = m * (période / 2) : m pair = gauche, m impair = droite
function dernierImpact(t, cote) {
  let best = -1, bk = -1;
  for (let k = 0; k < N; k++) {
    const h = periode(k) / 2;
    let m = Math.floor(t / h + 1e-9);
    if ((m & 1) !== cote) m -= 1;
    if (m < (cote === 0 ? 2 : 1)) continue;   // m = 0 est le lâcher, pas un impact
    // >= et non > : quand plusieurs pendules frappent au même instant
    // (t = 19,2 s p. ex.), c'est le plus long qui donne sa couleur.
    if (m * h >= best) { best = m * h; bk = k; }
  }
  return bk;
}

// ---------------------------------------------------------------------------
//  Son : une note par impact, aiguë pour les pendules courts
// ---------------------------------------------------------------------------
let audio = null;
const DEMI_TONS = [0, 3, 5, 7, 10];               // pentatonique mineure
const NOTES = Array.from({ length: N }, (_, i) =>
  220 * Math.pow(2, (DEMI_TONS[i % 5] + 12 * Math.floor(i / 5)) / 12));

function note(k) {
  if (!audio || audio.state !== 'running') return;
  const f = NOTES[N - 1 - k], t0 = audio.currentTime, g = audio.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.13, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
  g.connect(audio.destination);
  for (const [mult, amp] of [[1, 1], [2, 0.3], [3, 0.12]]) {
    const o = audio.createOscillator(), gg = audio.createGain();
    o.frequency.value = f * mult; gg.gain.value = amp;
    o.connect(gg); gg.connect(g);
    o.start(t0); o.stop(t0 + 1.7);
  }
}

// ---------------------------------------------------------------------------
//  Rendu
// ---------------------------------------------------------------------------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function redimensionner() {
  const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * d) || 1;
  cv.height = Math.round(r.height * d) || 1;
}
redimensionner();
addEventListener('resize', redimensionner);

function dessiner(t) {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';

  // les deux traits obliques
  for (const cote of [0, 1]) {
    const s = cote ? 1 : -1, k = dernierImpact(t, cote);
    ctx.strokeStyle = k < 0 ? '#ffffff' : rgba(COL[k]);
    ctx.lineWidth = 15;
    ctx.beginPath();
    ctx.moveTo(PX, PY);
    ctx.lineTo(PX + 2400 * s * Math.sin(GUIDE), PY + 2400 * Math.cos(GUIDE));
    ctx.stroke();
  }

  // fils d'abord, billes ensuite (elles passent devant)
  const pts = Array.from({ length: N }, (_, k) => {
    const a = angle(k, t), L = longueur(k);
    return [PX + L * Math.sin(a), PY + L * Math.cos(a)];
  });
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 6;
  for (const [x, y] of pts) {
    ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(x, y); ctx.stroke();
  }
  ctx.lineWidth = 3.5; ctx.strokeStyle = '#DDE4E4';
  pts.forEach(([x, y], k) => {
    ctx.fillStyle = rgba(COL[k], 0.9);
    ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill(); ctx.stroke();
  });
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(PX, PY, 6, 0, 6.2832); ctx.fill();
}

// ---------------------------------------------------------------------------
//  Boucle
// ---------------------------------------------------------------------------
let t = 0, dernier = null, actif = true;
function boucle(now) {
  requestAnimationFrame(boucle);
  if (dernier === null) dernier = now;
  const dt = Math.min((now - dernier) / 1000, 0.25);   // anti-saut de changement d'onglet
  dernier = now;
  if (actif) {
    const avant = t;
    t += dt;
    for (let k = 0; k < N; k++) {                      // impacts franchis pendant dt
      const h = periode(k) / 2;
      const m1 = Math.floor(t / h);
      for (let m = Math.floor(avant / h) + 1; m <= m1; m++) if (m > 0) note(k);
    }
  }
  dessiner(t);
}
requestAnimationFrame(boucle);

document.getElementById('play').onclick = e => {
  actif = !actif;
  e.target.setAttribute('aria-pressed', actif);
  e.target.textContent = actif ? '❚❚ pause' : '▶ lecture';
};
document.getElementById('snd').onclick = e => {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'running') {
    audio.suspend(); e.target.setAttribute('aria-pressed', 'false');
  } else {
    audio.resume(); e.target.setAttribute('aria-pressed', 'true');
  }
};
</script>
</body>
</html>
